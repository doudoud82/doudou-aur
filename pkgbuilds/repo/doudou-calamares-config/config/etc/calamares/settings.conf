modules-search: 
  - local
  - /etc/calamares/modules

instances:
  - id: CPU
    module: packagechooser
    config: packagechooser_CPU.conf
  - id: GPU
    module: packagechooser
    config: packagechooser_GPU.conf
  - id: desktop
    module: packagechooser
    config: packagechooser_desktop.conf
  - id: bootloader
    module: packagechooser
    config: packagechooser_bootloader.conf
  - id: rate-mirror
    module: shellprocess
    config: shellprocess_rate-mirror.conf
  - id: pacstrap
    module: shellprocess
    config: shellprocess_pacstrap.conf
  - id: config
    module: shellprocess
    config: shellprocess_config.conf
  - id: postinstall
    module: shellprocess
    config: shellprocess_postinstall.conf


sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@CPU
  - packagechooser@GPU
  - packagechooser@desktop
  - packagechooser@bootloader
  - partition
  - users
  - summary
- exec:
  - partition
  - requireencryption
  - shellprocess@rate-mirror
  - mount
  - shellprocess@pacstrap
  - locale
  - localecfg
  - hwclock
  - keyboard
  - hardware_config
  - bulkpackages
  - users
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: doudou

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
