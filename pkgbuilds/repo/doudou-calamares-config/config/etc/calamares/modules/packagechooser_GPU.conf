mode: required
method: packages
labels:
  step: "GPU Driver"
default: open
items:
  - id: open
    name: "Open Source"
    description: "Open Source Drivers covers Intel and AMD"
    packages:
      - lib32-mesa
      - lib32-vulkan-intel  
      - lib32-vulkan-radeon
      - mesa
      - vulkan-intel
      - vulkan-radeon
  - id: nvidia-580
    name: "Nvidia 580"
    description: "Old Nvidia 580 Driver for Kepler to Pascal (GTX 600 to GTX 1000)"
    packages:
      - lib32-nvidia-580xx-utils
      - lib32-opencl-nvidia-580xx
      - libxnvctrl-580xx
      - nvidia-580xx-dkms
      - nvidia-580xx-settings
      - nvidia-580xx-utils
      - opencl-nvidia-580xx
  - id: nvidia-open
    name: "Nvidia Open"
    description: "Nvidia Open Drivers for GTX1600/RTX2000 and newer"
    packages:
    - lib32-nvidia-utils
    - lib32-opencl-nvidia
    - libxnvctrl
    - nvidia-open-dkms
    - nvidia-settings
    - nvidia-utils
    - opencl-nvidia
