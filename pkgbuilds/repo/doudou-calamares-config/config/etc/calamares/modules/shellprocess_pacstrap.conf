dontChroot: true
verbose: true
script:
  - "mkdir -p /etc/pacman.d/hooks"
  - "ln -sf /dev/null /etc/pacman.d/hooks/90-mkinitcpio-install.hook"
  - "ln -sf /dev/null /etc/pacman.d/hooks/mkinitcpio-firmware.hook"
  - "mount --make-rslave ${ROOT}/dev"
  - "mount --make-rslave ${ROOT}/proc"
  - "mount --make-rslave ${ROOT}/sys"
  - "mount --make-rslave ${ROOT}/run"
  - command: >- 
      pacstrap -K ${ROOT} 
      base
      btrfs-progs
      chaotic-keyring
      chaotic-mirrorlist
      cryptsetup
      dosfstools
      doudou-aur-keyring
      doudou-aur-mirrorlist
      efibootmgr
      exfatprogs
      fwupd
      iptables
      mtools
      nano
      nano-syntax-highlighting
      networkmanager
      nss-mdns
      openresolv
      polkit
      sbctl
      snapper
      sudo
      systemd
      systemd-ukify
      tpm2-tools
      zram-generator
    timeout: 3600
  - "cp /etc/pacman.conf ${ROOT}/etc/pacman.conf"
  - "cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/mirrorlist"
  - "genfstab -U ${ROOT} >> ${ROOT}/etc/fstab"
  - "cp -L --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"