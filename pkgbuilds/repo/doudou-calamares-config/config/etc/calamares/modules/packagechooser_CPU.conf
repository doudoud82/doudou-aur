mode: required
method: packages
labels:
  step: "CPU microcode"
default: AMD
items:
  - id: AMD
    name: "AMD"
    description: "AMD microcode"
    packages:
      - amd-ucode
  - id: Intel
    name: "Intel"
    description: "Intel microcode plus va-api"
    packages:
      - intel-ucode
      - intel-compute-runtime
      - intel-media-driver
      - intel-gmmlib
  - id: Intel-legacy
    name: "Intel hardware acceleration version 24"
    description: "Same as intel profile but uses version 24 of the driver that works better with older CPUs in my personal case i5-8250U"
    packages:
      - intel-ucode
      - intel-compute-runtime-legacy
      - intel-media-driver-legacy
      - intel-gmmlib-legacy
