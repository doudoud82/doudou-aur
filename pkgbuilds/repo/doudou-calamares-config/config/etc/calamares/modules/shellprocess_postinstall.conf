dontChroot: false
verbose: true
script:
  - "ln -sf /usr/share/fontconfig/conf.avail/10-nerd-font-symbols.conf /etc/fonts/conf.d/"
  - "systemctl enable post-install.service"
  - "systemctl enable NetworkManager"
  - "systemctl enable avahi-daemon"
  - "systemctl enable sshd"
  - "systemctl enable pkgfile-update.timer"
  - "systemctl mask systemd-resolved.service"
  - "systemctl enable firewalld"
  - "firewall-offline-cmd --zone=public --add-service=dns"
  - "firewall-offline-cmd --zone=public --add-service=mdns"
  - "firewall-offline-cmd --zone=public --add-service=ssh"
  - "if pacman -Qq gdm >/dev/null 2>&1; then systemctl enable gdm.service; elif pacman -Qq plasma-login-manager >/dev/null 2>&1; then systemctl enable plasmalogin.service; fi"
  - "systemctl enable systemd-boot-update.service"
  - "if pacman -Qq limine-mkinitcpio-hook >/dev/null 2>&1; then limine-install; fi"
  - "pacman -S snap-pac --noconfirm"
  - "rm -f /etc/resolv.conf"  