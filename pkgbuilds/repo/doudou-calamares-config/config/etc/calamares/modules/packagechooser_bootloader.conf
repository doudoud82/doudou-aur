mode: required
method: packages
labels:
  step: "Bootloader"
default: systemd-boot
items:
  - id: systemd-boot
    name: "Systemd-boot"
    description: "Systemd UEFI boot manager"
    screenshot: "images/systemd.png"
  - id: limine
    name: "Limine"
    description: "Limine boot manager for btrfs snapshots. it also installs systemd-boot as a fallback."
    packages:
      - limine
      - limine-mkinitcpio-hook
      - limine-snapper-sync
    screenshot: "images/limine.png"