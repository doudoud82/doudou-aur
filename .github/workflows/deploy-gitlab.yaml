
name: Deploy Repository to GitLab

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Build Packages"]
    types: [completed]
    branches: [master]

  push:
    branches: [master]
    paths:
      - "x86_64/**"
      - "pkgbuilds/repo/doudou-aur-keyring/doudou-aur.gpg"
      - ".gitlab-ci.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gitlab
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git clone --depth=1 --branch master "https://oauth2:${GITLAB_TOKEN}@gitlab.com/doudoud82/doudou-aur.git" deploy
          cd deploy

          git config user.name "doudou"
          git config user.email "31397487-doudoud82@users.noreply.gitlab.com"

          git lfs install --local
          git lfs track "x86_64/**"

          rsync -a --delete ../x86_64/ x86_64/
          cp ../pkgbuilds/repo/doudou-aur-keyring/doudou-aur.gpg .
          cp ../.gitlab-ci.yml .

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy Arch repository"

          git push origin master
