# Thanks to https://github.com/jlumbroso/lfs-to-github-pages
name: GitHub Pages Build

on:
    push:
        branches:
            - master # Set a branch to deploy
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-22.04
        steps:
            - name: 🛎️ Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
                  lfs: true # Fetch large files

            - name: ❌ Turn off LFS
              run: >-
                  git lfs uninstall;
                  cp pkgbuilds/repo/keyring/doudou-aur.gpg .;
                  rm -Rf .git;
                  rm -Rf .gitmodules;
                  rm -Rf pkgbuilds;
                  rm -f Containerfile;
                  rm -f entrypoint.sh;
                  rm -f build.sh;
                  rm -f .gitattributes;
                  rm -f .gitignore;
                  rm -f generate-env.sh;
                  rm -f LICENCE;
                  rm -f README.md;
                  rm -f add-aur-package.sh;
                  rm -f run-build.sh;
                  rm -f packages.txt;
                  rm -f generate-github-secrets.sh;
                  rm -f update-aur-packages.sh;
                  cd x86_64
                  latest=$(ls -v doudou-aur-keyring-*-any.pkg.tar.zst | tail -n1)
                  cp -f "$latest"     doudou-aur-keyring.pkg.tar.zst
                  cp -f "$latest.sig" doudou-aur-keyring.pkg.tar.zst.sig
                  latest=$(ls -v doudou-aur-mirrorlist-*-any.pkg.tar.zst | tail -n1)
                  cp -f "$latest"     doudou-aur-mirrorlist.pkg.tar.zst
                  cp -f "$latest.sig" doudou-aur-mirrorlist.pkg.tar.zst.sig

            - name: 🚀 Deploy to `gh-pages` branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./
                  publish_branch: gh-pages
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"
