image: alpine:latest

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

pages:
  stage: deploy

  before_script:
    - apk add --no-cache git git-lfs
    - git lfs install

  script:
    # Download actual LFS objects
    - git lfs fetch origin "$CI_COMMIT_SHA"
    - git lfs checkout

    # Verify that no LFS pointers remain
    - |
      if grep -rIl 'version https://git-lfs.github.com/spec/v1' x86_64/; then
        echo "ERROR: LFS pointer files detected!"
        exit 1
      fi

    - mkdir -p public
    - cp -a x86_64 public/
    - cp doudou-aur.gpg public/
    - cd public/x86_64/
    - latest=$(ls -v doudou-aur-keyring-*-any.pkg.tar.zst | tail -n1)
    - cp -f "$latest"     doudou-aur-keyring.pkg.tar.zst
    - cp -f "$latest.sig" doudou-aur-keyring.pkg.tar.zst.sig
    - latest=$(ls -v doudou-aur-mirrorlist-*-any.pkg.tar.zst | tail -n1)
    - cp -f "$latest"     doudou-aur-mirrorlist.pkg.tar.zst
    - cp -f "$latest.sig" doudou-aur-mirrorlist.pkg.tar.zst.sig

  artifacts:
    expire_in: 1 min
    paths:
      - public/

  only:
    - master
